[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "python-magicmodels"
version = "0.2.0"
description = "A CLI tool to generate production-ready Django and FastAPI projects from a simple schema."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "Prashant Karna", email = "prashantkarna21@gmail.com"}
]
dependencies = [
    # No external dependencies strictly required for the CLI logic itself
]

[project.scripts]
magicmodels = "magicmodels.cli:main"

[tool.setuptools.packages.find]
include = ["magicmodels*"]
